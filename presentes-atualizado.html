<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#091847">
  <title>Presentes · Fernando Miguel</title>
  <style>
    :root{--navy:#071943;--blue:#1477c9;--red:#e52d3e;--gold:#ffc928;--ice:#edf4ff;--ink:#102147;--muted:#51617f}
    *{box-sizing:border-box}body{margin:0;background:var(--ice);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}.hero{background:radial-gradient(ellipse at top,#1d60ad,#071943 72%);color:#fff;padding:25px 0 34px;border-bottom:8px solid var(--gold)}.wrap{width:min(100% - 28px,980px);margin:auto}.back{color:#d8eaff;text-decoration:none;font-weight:800}.eyebrow{display:block;text-transform:uppercase;letter-spacing:.13em;color:#ffc928;font-size:.78rem;font-weight:900;margin-top:26px}.hero h1{font-size:clamp(2.2rem,8vw,3.7rem);line-height:1.02;margin:8px 0 11px;max-width:780px}.hero p{margin:0;color:#d4e5ff}.main{padding:30px 0 54px}.guest-note{display:none;background:#e8f7ed;color:#17653b;border:1px solid #a9dfbb;border-radius:12px;padding:12px 15px;font-weight:750;margin:0 0 20px}.section-title{font-size:1.35rem;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.gift{background:#fff;border:1px solid #dce6f1;border-radius:18px;overflow:hidden;box-shadow:0 8px 22px #09234c10;display:flex;flex-direction:column}.gift-img{height:240px;background:#fff;display:grid;place-items:center;padding:12px;border-bottom:1px solid #edf1f5}.gift-img img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;cursor:zoom-in}.gift-img img:focus-visible{outline:4px solid var(--gold);outline-offset:3px}.gift-size{margin:0 0 10px;padding:10px;background:#e52d3e;color:#fff;border-radius:10px;text-align:center;text-transform:uppercase;font-weight:1000;letter-spacing:.05em;box-shadow:0 4px 0 #a91e2a}.gift-body{padding:12px;display:flex;flex-direction:column;flex:1}.gift-body .btn{margin-top:auto}.other-art{background:radial-gradient(circle at 50% 44%,#ffdc52 0 27%,transparent 28%),repeating-conic-gradient(from 0deg at 50% 48%,#ef4145 0deg 12deg,#ffdc52 12deg 24deg)!important}.other-art>div{display:grid;justify-items:center;gap:4px;color:#091847;text-align:center}.question-mark{display:grid;place-items:center;width:106px;height:106px;border:7px solid #091847;border-radius:50%;background:#fff;color:#ef4145;font-size:5rem;font-weight:1000;line-height:1;box-shadow:0 6px 0 #091847;transform:rotate(-8deg)}.other-art strong{font-size:1.1rem;font-weight:1000;text-transform:uppercase;text-shadow:1px 1px #fff}.btn{border:0;display:flex;align-items:center;justify-content:center;width:100%;background:var(--gold);color:#15213e;text-decoration:none;font:inherit;font-weight:900;padding:13px 16px;border-radius:12px;box-shadow:0 5px 0 #c28a2d;cursor:pointer}.gift-status{display:none;margin-top:10px;border-radius:10px;padding:10px 12px;background:#fff5d9;color:#664c00;font-size:.85rem;font-weight:700}.btn.selected{background:#1255a4;color:#fff;box-shadow:0 5px 0 #091847}.selection-panel{margin:30px 0 0;padding:20px;background:#fff;border:1px solid #dce6f1;border-radius:18px;box-shadow:0 8px 22px #09234c10}.selection-status{margin:0 0 14px;color:var(--muted);font-weight:750}.send-error{display:none;margin:0 0 12px;color:#9c1c26;background:#fff0f0;padding:11px 13px;border-radius:10px;font-weight:750}.send-btn{border:0;display:flex;align-items:center;justify-content:center;width:100%;background:#128c4a;color:#fff;font:inherit;font-weight:950;padding:14px 18px;border-radius:12px;box-shadow:0 5px 0 #086435;cursor:pointer}.card-section{margin-top:36px}.card-section>p{color:var(--muted);max-width:650px}.gift-card{position:relative;width:min(100%,420px);aspect-ratio:1.586;margin:20px 0 14px;border:0;border-radius:22px;overflow:hidden;background:#091847;box-shadow:0 16px 32px #0b1f4940;color:#fff}.gift-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 66%}.gift-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#08173c22 5%,#08173c05 38%,#08173cd9 100%)}.card-chip{position:absolute;z-index:1;top:15px;left:16px;width:37px;height:29px;border:1px solid #fff9;border-radius:6px;background:linear-gradient(135deg,#e9d68a,#b89c50);box-shadow:inset 0 0 0 2px #ffffff40}.card-brand{position:absolute;z-index:1;top:15px;right:17px;text-transform:uppercase;font-size:.7rem;font-weight:900;letter-spacing:.13em;text-shadow:0 2px 7px #000}.card-name{position:absolute;z-index:1;left:18px;right:18px;bottom:15px;color:#fff;font-size:clamp(1.1rem,5vw,1.55rem);line-height:1.15;font-weight:950;letter-spacing:.04em;text-shadow:0 2px 8px #000}.reload-btn{display:inline-flex;align-items:center;justify-content:center;background:#e4313b;color:#fff;text-decoration:none;font:inherit;font-weight:950;padding:14px 24px;border:0;border-radius:12px;box-shadow:0 5px 0 #a91e2a;cursor:pointer}.reload-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a91e2a}.image-dialog{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:12px;border:0;background:#07132ff5;color:#fff}.image-dialog::backdrop{background:#07132ff5}.image-dialog-inner{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}.image-close{justify-self:end;border:0;border-radius:999px;width:44px;height:44px;background:#fff;color:#091847;font-size:1.6rem;font-weight:900;cursor:pointer}.image-dialog img{display:block;width:100%;height:100%;object-fit:contain}.pix-dialog{width:min(100% - 28px,460px);border:0;border-radius:20px;padding:24px;color:var(--ink);box-shadow:0 20px 60px #06153455}.pix-dialog::backdrop{background:#061534a8}.pix-dialog h3{margin:0 0 8px;font-size:1.35rem}.pix-dialog p{color:var(--muted)}.pix-key{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f2f6fc;border:1px dashed #90a4bf;border-radius:12px;padding:13px;font-weight:900;word-break:break-all}.pix-actions{display:grid;gap:10px;margin-top:15px}.pix-copy{border:0;background:var(--gold);color:var(--ink);font:inherit;font-weight:900;padding:12px;border-radius:11px;cursor:pointer}.pix-whatsapp{display:block;text-align:center;background:#128c4a;color:#fff;text-decoration:none;font-weight:900;padding:12px;border-radius:11px}.pix-close{display:block;margin:12px auto 0;border:0;background:none;color:var(--muted);font:inherit;font-weight:750;padding:8px;cursor:pointer}.thank-you{font-size:1rem!important;color:var(--ink)!important;max-width:640px}.payment-note{font-size:.85rem;color:var(--muted);max-width:640px}.footer{padding:22px;text-align:center;color:var(--muted);font-size:.85rem}
    @media(max-width:600px){.grid{grid-template-columns:1fr}.gift-img{height:260px}.main{padding-top:23px}.hero .eyebrow{margin-top:23px}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><a class="back" href="/">← Voltar ao convite</a><span class="eyebrow">Observação</span><h1>Tamanhos das roupas e sapatos</h1><p>Roupa: tamanho 4 · Sapato: 26/27</p></div></header>
  <main class="wrap main">
    <p id="guest-note" class="guest-note"></p>
    <h2 class="section-title">Sugestões de presente</h2>
    <div class="grid">
      <article class="gift" data-gift-id="101" data-gift-label="Roupa tamanho 4"><div class="gift-img"><img src="/roupa-tamanho-4.jpg" alt="Roupa infantil do Homem-Aranha" role="button" tabindex="0" aria-label="Ampliar imagem da roupa tamanho 4" loading="lazy"></div><div class="gift-body"><button class="btn buy" type="button" aria-pressed="false">Vou comprar</button><div class="gift-status" role="status"></div></div></article>
      <article class="gift" data-gift-id="102" data-gift-label="Sapato tamanho 26/27"><div class="gift-img"><img src="/tenis.jpg" alt="Tênis infantil do Homem-Aranha" role="button" tabindex="0" aria-label="Ampliar imagem do sapato tamanho 26/27" loading="lazy"></div><div class="gift-body"><button class="btn buy" type="button" aria-pressed="false">Vou comprar</button><div class="gift-status" role="status"></div></div></article>
    </div>

    <section class="selection-panel" aria-label="Enviar confirmação e escolha">
      <p class="selection-status" id="selection-status">Escolha roupa, sapato ou os dois.</p>
      <p class="send-error" id="send-error" role="alert"></p>
      <button class="send-btn" id="send-confirmation" type="button">Enviar confirmação e escolha pelo WhatsApp</button>
    </section>
  </main>
  <dialog class="image-dialog" id="image-dialog" aria-label="Imagem inteira do presente"><div class="image-dialog-inner"><button class="image-close" id="image-close" type="button" aria-label="Fechar imagem">×</button><img id="image-full" alt=""></div></dialog>
  <footer class="footer">Fernando Miguel · 4 anos</footer>
  <script>
    const familyWhatsApp='5515996411491';
    const imageDialog=document.querySelector('#image-dialog');
    const fullImage=document.querySelector('#image-full');
    function openFullImage(img){fullImage.src=img.currentSrc||img.src;fullImage.alt=img.alt;imageDialog.showModal()}
    document.querySelectorAll('.gift-img img[role=button]').forEach(img=>{img.addEventListener('click',()=>openFullImage(img));img.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openFullImage(img)}})});
    document.querySelector('#image-close').addEventListener('click',()=>imageDialog.close());
    imageDialog.addEventListener('click',event=>{if(event.target===imageDialog)imageDialog.close()});
    const ageLabels={adulto:'Adulto',adolescente:'Adolescente',crianca_6_11:'Criança de 6 a 11 anos',crianca_ate_5:'Criança até 5 anos'};
    const attendees=JSON.parse(sessionStorage.getItem('fernandoMiguelRSVP')||'[]');
    const guestLines=attendees.map(p=>`• ${p.nome} ${p.sobrenome} — ${ageLabels[p.faixaEtaria]||p.faixaEtaria}`).join('\n');
    const savedChoice=JSON.parse(sessionStorage.getItem('fernandoMiguelGiftChoice')||'null');
    let choice={gifts:(Array.isArray(savedChoice?.gifts)?savedChoice.gifts:[]).filter(i=>i===101||i===102),pix:false};
    const selectionStatus=document.querySelector('#selection-status');
    const errorBox=document.querySelector('#send-error');
    function updateChoice(next){
      choice=next;sessionStorage.setItem('fernandoMiguelGiftChoice',JSON.stringify(choice));
      document.querySelectorAll('.gift').forEach(card=>{
        const id=Number(card.dataset.giftId),button=card.querySelector('.buy'),selected=choice.gifts.includes(id);
        button.classList.toggle('selected',selected);button.textContent=selected?'Escolhido ✓':'Vou comprar';button.setAttribute('aria-pressed',String(selected));
      });
      const picked=choice.gifts.map(i=>i===101?'Roupa tamanho 4':'Sapato tamanho 26/27');
      selectionStatus.textContent=picked.length?`Você escolheu: ${picked.join(' e ')}.`:'Escolha roupa, sapato ou os dois.';
      errorBox.style.display='none';
    }
    document.querySelectorAll('.buy').forEach(button=>button.addEventListener('click',()=>{
      const gifts=new Set(choice.gifts);
      const item=Number(button.closest('.gift').dataset.giftId);
      if(gifts.has(item))gifts.delete(item);else gifts.add(item);
      updateChoice({...choice,gifts:[...gifts].sort((a,b)=>a-b)});
    }));
    if(attendees.length){const note=document.querySelector('#guest-note');note.textContent=`Obrigado, ${attendees[0].nome}! Sua confirmação foi preenchida para ${attendees.length} ${attendees.length===1?'pessoa':'pessoas'}.`;note.style.display='block'}
        document.querySelector('#send-confirmation').addEventListener('click',()=>{
      if(!attendees.length){errorBox.textContent='Preencha primeiro os dados de presença.';errorBox.style.display='block';return}
      if(!choice.gifts.length){errorBox.textContent='Escolha a roupa, o sapato ou os dois.';errorBox.style.display='block';return}
      const giftLines=choice.gifts.map(i=>i===101?'Vou levar uma roupa tamanho 4.':'Vou levar um sapato tamanho 26/27.').join('\n');
      const message=`Oi! Confirmo presença no aniversário do Fernando Miguel.\n\nConvidados:\n${guestLines}\n\nMinha escolha de presente:\n${giftLines}`;
      window.open(`https://wa.me/${familyWhatsApp}?text=${encodeURIComponent(message)}`,'_blank','noopener');
    });
    updateChoice(choice);
  </script>
</body>
</html>
